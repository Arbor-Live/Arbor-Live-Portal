name: E2E

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "workers/**"
      - "**/*.md"
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: "true"
      CONVEX_AGENT_MODE: anonymous
      # Local-only secret for anonymous Convex + Better Auth in CI.
      BETTER_AUTH_SECRET: e2e-ci-better-auth-secret-32chars-min
      # Build once and serve, rather than compiling routes on first request.
      # Convex's 1s function limit is wall-clock, so dev-mode compilation
      # competing for the runner's 4 vCPUs times out queries that aren't slow.
      E2E_WEB_MODE: prod
      # Anonymous Convex is fresh each run — no stale seed/users to prune.
      E2E_SKIP_PRUNE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium is ~150MB; the lockfile pins the Playwright version, so the
      # cache only misses when that version actually changes.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # `.next/cache` carries the compiler cache across runs. Keyed on source so
      # an unchanged tree reuses it, with a lockfile-scoped fallback so a source
      # change still starts from the last build rather than cold.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: >-
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{
            hashFiles('apps/web/src/**', 'apps/web/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Run e2e shard
        run: |
          for attempt in 1 2 3; do
            echo "e2e shard ${{ matrix.shard }}/4 attempt ${attempt}/3"
            if pnpm test:e2e -- --shard=${{ matrix.shard }}/4; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Shard failed (often anonymous Convex binary download); retrying in 30s…"
              sleep 30
            fi
          done
          exit 1

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 1
          if-no-files-found: ignore

  merge-reports:
    name: Merge reports
    if: always() && !cancelled()
    needs: [playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push failure screenshots to the scratch media branch
      pull-requests: write # post/update the flake comment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: >-
          pnpm --filter web exec playwright merge-reports
          --config=playwright.merge.config.ts
          ../../all-blob-reports

      # Runs on success too: a green suite can still contain retried (flaky)
      # tests, and those are the ones worth surfacing before they become
      # failures.
      - name: Comment on failures and flakes
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/e2e-flake-comment.mjs

      - name: Upload Playwright report
        if: always() && needs.playwright.result != 'cancelled'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/e2e-report
            apps/web/test-results
            apps/web/e2e-results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Require all shards green
        if: needs.playwright.result != 'success'
        run: exit 1
