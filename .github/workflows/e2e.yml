name: E2E

on:
  pull_request:
  push:
    branches: [main]

# Serialize against the shared e2e Convex deployment (when CONVEX_DEPLOY_KEY is set).
concurrency:
  group: e2e-shared
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      # Prefer a dedicated cloud deploy key (repo secret). Falls back to anonymous
      # local Convex only when the secret is missing / empty.
      CONVEX_DEPLOY_KEY: ${{ secrets.E2E_CONVEX_DEPLOY_KEY }}
      BETTER_AUTH_SECRET: e2e-ci-better-auth-secret-32chars-min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run e2e suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/e2e-report
            apps/web/test-results
          retention-days: 7
